name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # rebuild hourly so edits made in Notion show up on the site
  schedule:
    - cron: '0 * * * *'
  # "Run workflow" button for an immediate rebuild after editing Notion
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # lets keepalive re-enable the hourly schedule, which GitHub otherwise
  # turns off after 60 days without commits
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm next build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: gautamkrishnar/keepalive-workflow@v2
